x-app-base: &app-base
  build:
    context: .
    dockerfile: docker/Dockerfile.dev
  environment:
    - NODE_ENV=production
    - DB_HOST=${DB_HOST:-mariadb}
    - DB_PORT=3306
    - DB_USER=${DB_USER}
    - DB_PASSWORD=${DB_PASSWORD}
    - DB_NAME=${DB_NAME}
    - DB_POOL_SIZE=${DB_POOL_SIZE:-10}
    - API_KEY=${API_KEY}
    - ADMIN_BASIC_USER=${ADMIN_BASIC_USER:-}
    - ADMIN_BASIC_PASSWORD=${ADMIN_BASIC_PASSWORD:-}
    - ADMIN_SESSION_SECRET=${ADMIN_SESSION_SECRET:-}
    - CORS_ORIGINS=${CORS_ORIGINS}
    - API_URL=${API_URL:-http://api:3000}
    - I18N_LANGUAGES=${I18N_LANGUAGES:-es,en}
    - I18N_DEFAULT_LANGUAGE=${I18N_DEFAULT_LANGUAGE:-es}
    - I18N_CONTENT_BASE_LANGUAGE=${I18N_CONTENT_BASE_LANGUAGE:-en}
    - OPENAI_API_KEY=${OPENAI_API_KEY}
    - BRAVE_SEARCH_API_KEY=${BRAVE_SEARCH_API_KEY}
    - OVERPASS_BASE_URL=${OVERPASS_BASE_URL:-https://overpass-api.de/api/interpreter}
    - OVERPASS_TIMEOUT_MS=${OVERPASS_TIMEOUT_MS:-5000}
    - OSRM_BASE_URL=${OSRM_BASE_URL:-http://osrm:5000}
    - OSRM_TIMEOUT_MS=${OSRM_TIMEOUT_MS:-5000}
    - GEO_RETRY_MAX_ATTEMPTS=${GEO_RETRY_MAX_ATTEMPTS:-3}
    - GEO_RETRY_BASE_DELAY_MS=${GEO_RETRY_BASE_DELAY_MS:-200}
    - GEO_RETRY_MAX_DELAY_MS=${GEO_RETRY_MAX_DELAY_MS:-2000}
    - GEO_CIRCUIT_FAILURE_THRESHOLD=${GEO_CIRCUIT_FAILURE_THRESHOLD:-5}
    - GEO_CIRCUIT_OPEN_MS=${GEO_CIRCUIT_OPEN_MS:-120000}
    - GEO_CACHE_MAX_ENTRIES=${GEO_CACHE_MAX_ENTRIES:-2000}
    - GEO_CACHE_TTL_MS_WATER=${GEO_CACHE_TTL_MS_WATER:-86400000}
    - GEO_CACHE_TTL_MS_CITY=${GEO_CACHE_TTL_MS_CITY:-21600000}
    - GEO_CACHE_TTL_MS_ROUTE=${GEO_CACHE_TTL_MS_ROUTE:-3600000}
  volumes:
    - .:/app
    - node_modules:/app/node_modules

services:
  osrm-init:
    image: osrm/osrm-backend:latest
    profiles:
      - routing
      - routing-init
    environment:
      - OSRM_PBF_FILE=${OSRM_PBF_FILE:-spain-latest.osm.pbf}
    volumes:
      - osrm_data:/data
    command: >-
      sh -c 'set -e;
      FILE="/data/$${OSRM_PBF_FILE:-spain-latest.osm.pbf}";
      if [ ! -f "$${FILE}" ]; then
        echo "Missing OSM PBF at $${FILE}. Run scripts/osrm-bootstrap.sh first.";
        exit 1;
      fi;
      if [ -f "$${FILE}.osrm.mldgr" ]; then
        echo "OSRM dataset already prepared: $${FILE}";
        exit 0;
      fi;
      osrm-extract -p /opt/car.lua "$${FILE}";
      osrm-partition "$${FILE}";
      osrm-customize "$${FILE}";'

  osrm:
    image: osrm/osrm-backend:latest
    profiles:
      - routing
    depends_on:
      osrm-init:
        condition: service_completed_successfully
    environment:
      - OSRM_PBF_FILE=${OSRM_PBF_FILE:-spain-latest.osm.pbf}
    volumes:
      - osrm_data:/data
    command: >-
      sh -c 'set -e;
      FILE="/data/$${OSRM_PBF_FILE:-spain-latest.osm.pbf}";
      osrm-routed --algorithm mld "$${FILE}"'
    ports:
      - "5000:5000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider \"http://localhost:5000/route/v1/driving/-8.3186,43.3328;-8.04799,43.35316?overview=false\" || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  mariadb:
    image: mariadb:11
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT:-3316}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    <<: *app-base
    command: sh /app/scripts/app-prepare.sh
    healthcheck:
      test: ["CMD", "test", "-f", "/app/.dev_ready"]
      interval: 5s
      timeout: 5s
      retries: 3

  api:
    <<: *app-base
    ports:
      - "3010:3000"
    environment:
      - NODE_ENV=development
      - DB_HOST=${DB_HOST:-mariadb}
      - DB_PORT=3306
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DB_POOL_SIZE=${DB_POOL_SIZE:-10}
      - API_KEY=${API_KEY}
      - ADMIN_BASIC_USER=${ADMIN_BASIC_USER:-}
      - ADMIN_BASIC_PASSWORD=${ADMIN_BASIC_PASSWORD:-}
      - ADMIN_SESSION_SECRET=${ADMIN_SESSION_SECRET:-}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - API_URL=${API_URL:-http://api:3000}
      - I18N_LANGUAGES=${I18N_LANGUAGES:-es,en}
      - I18N_DEFAULT_LANGUAGE=${I18N_DEFAULT_LANGUAGE:-es}
      - I18N_CONTENT_BASE_LANGUAGE=${I18N_CONTENT_BASE_LANGUAGE:-en}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - BRAVE_SEARCH_API_KEY=${BRAVE_SEARCH_API_KEY}
      - OVERPASS_BASE_URL=${OVERPASS_BASE_URL:-https://overpass-api.de/api/interpreter}
      - OVERPASS_TIMEOUT_MS=${OVERPASS_TIMEOUT_MS:-5000}
      - OSRM_BASE_URL=${OSRM_BASE_URL:-http://osrm:5000}
      - OSRM_TIMEOUT_MS=${OSRM_TIMEOUT_MS:-5000}
      - GEO_RETRY_MAX_ATTEMPTS=${GEO_RETRY_MAX_ATTEMPTS:-3}
      - GEO_RETRY_BASE_DELAY_MS=${GEO_RETRY_BASE_DELAY_MS:-200}
      - GEO_RETRY_MAX_DELAY_MS=${GEO_RETRY_MAX_DELAY_MS:-2000}
      - GEO_CIRCUIT_FAILURE_THRESHOLD=${GEO_CIRCUIT_FAILURE_THRESHOLD:-5}
      - GEO_CIRCUIT_OPEN_MS=${GEO_CIRCUIT_OPEN_MS:-120000}
      - GEO_CACHE_MAX_ENTRIES=${GEO_CACHE_MAX_ENTRIES:-2000}
      - GEO_CACHE_TTL_MS_WATER=${GEO_CACHE_TTL_MS_WATER:-86400000}
      - GEO_CACHE_TTL_MS_CITY=${GEO_CACHE_TTL_MS_CITY:-21600000}
      - GEO_CACHE_TTL_MS_ROUTE=${GEO_CACHE_TTL_MS_ROUTE:-3600000}
    depends_on:
      mariadb:
        condition: service_healthy
      app:
        condition: service_healthy
    command: sh /app/scripts/api-start.sh

  web:
    <<: *app-base
    ports:
      - "3011:3001"
    environment:
      - NODE_ENV=development
      - DB_HOST=${DB_HOST:-mariadb}
      - DB_PORT=3306
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DB_POOL_SIZE=${DB_POOL_SIZE:-10}
      - API_KEY=${API_KEY}
      - ADMIN_BASIC_USER=${ADMIN_BASIC_USER:-}
      - ADMIN_BASIC_PASSWORD=${ADMIN_BASIC_PASSWORD:-}
      - ADMIN_SESSION_SECRET=${ADMIN_SESSION_SECRET:-}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - BRAVE_SEARCH_API_KEY=${BRAVE_SEARCH_API_KEY}
      - API_URL=http://api:3000
      - NEXT_PUBLIC_API_URL=http://localhost:3010
      - I18N_LANGUAGES=${I18N_LANGUAGES:-es,en}
      - I18N_DEFAULT_LANGUAGE=${I18N_DEFAULT_LANGUAGE:-es}
      - I18N_CONTENT_BASE_LANGUAGE=${I18N_CONTENT_BASE_LANGUAGE:-en}
      - OVERPASS_BASE_URL=${OVERPASS_BASE_URL:-https://overpass-api.de/api/interpreter}
      - OVERPASS_TIMEOUT_MS=${OVERPASS_TIMEOUT_MS:-5000}
      - OSRM_BASE_URL=${OSRM_BASE_URL:-http://osrm:5000}
      - OSRM_TIMEOUT_MS=${OSRM_TIMEOUT_MS:-5000}
      - GEO_RETRY_MAX_ATTEMPTS=${GEO_RETRY_MAX_ATTEMPTS:-3}
      - GEO_RETRY_BASE_DELAY_MS=${GEO_RETRY_BASE_DELAY_MS:-200}
      - GEO_RETRY_MAX_DELAY_MS=${GEO_RETRY_MAX_DELAY_MS:-2000}
      - GEO_CIRCUIT_FAILURE_THRESHOLD=${GEO_CIRCUIT_FAILURE_THRESHOLD:-5}
      - GEO_CIRCUIT_OPEN_MS=${GEO_CIRCUIT_OPEN_MS:-120000}
      - GEO_CACHE_MAX_ENTRIES=${GEO_CACHE_MAX_ENTRIES:-2000}
      - GEO_CACHE_TTL_MS_WATER=${GEO_CACHE_TTL_MS_WATER:-86400000}
      - GEO_CACHE_TTL_MS_CITY=${GEO_CACHE_TTL_MS_CITY:-21600000}
      - GEO_CACHE_TTL_MS_ROUTE=${GEO_CACHE_TTL_MS_ROUTE:-3600000}
    depends_on:
      mariadb:
        condition: service_healthy
      app:
        condition: service_healthy
      api:
        condition: service_started
    command: pnpm --filter @silicon-traveler/web dev

  scheduler:
    <<: *app-base
    profiles:
      - scheduler
    depends_on:
      mariadb:
        condition: service_healthy
      app:
        condition: service_healthy
    command: sh -c "pnpm --filter @silicon-traveler/scheduler build && pnpm --filter @silicon-traveler/scheduler start"

volumes:
  mariadb_data:
  node_modules:
  osrm_data:
