name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Trust deployment host
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync deployable code and seed assets
        run: |
          ssh "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" "mkdir -p ${{ secrets.DEPLOY_PATH }}/code ${{ secrets.DEPLOY_PATH }}/context/pictures_seed"
          rsync -az --delete -e "ssh -o LogLevel=QUIET" \
            --exclude node_modules --exclude .env --exclude images --exclude '*.log' \
            ./code/ "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}/code/"
          rsync -az --delete -e "ssh -o LogLevel=QUIET" \
            ./context/pictures_seed/ "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}/context/pictures_seed/"

      - name: Write production environment
        run: |
          ssh "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" "cat > ${{ secrets.DEPLOY_PATH }}/code/.env << 'EOF'
          DB_HOST=mariadb
          DB_PORT=3306
          DB_USER=${{ secrets.PROD_DB_USER }}
          DB_PASSWORD=${{ secrets.PROD_DB_PASSWORD }}
          DB_NAME=${{ secrets.PROD_DB_NAME }}
          DB_POOL_SIZE=10
          DB_ROOT_PASSWORD=${{ secrets.PROD_DB_ROOT_PASSWORD }}
          API_KEY=${{ secrets.PROD_API_KEY }}
          ADMIN_BASIC_USER=${{ secrets.ADMIN_BASIC_USER }}
          ADMIN_BASIC_PASSWORD=${{ secrets.ADMIN_BASIC_PASSWORD }}
          ADMIN_SESSION_SECRET=${{ secrets.ADMIN_SESSION_SECRET }}
          CORS_ORIGINS=${{ secrets.PROD_CORS_ORIGINS }}
          API_URL=${{ secrets.PROD_API_URL }}
          NEXT_PUBLIC_API_URL=${{ secrets.PROD_NEXT_PUBLIC_API_URL }}
          STORAGE_DIR=/app/images
          SEED_PHOTOS_SOURCE_DIR=/context/pictures_seed
          I18N_LANGUAGES=es,en
          I18N_DEFAULT_LANGUAGE=es
          I18N_CONTENT_BASE_LANGUAGE=en
          OPENAI_API_KEY=${{ secrets.PROD_OPENAI_API_KEY }}
          IMAGE_MODEL=gpt-image-1.5
          BRAVE_SEARCH_API_KEY=${{ secrets.PROD_BRAVE_SEARCH_API_KEY }}
          EOF"

      - name: Build and start services
        run: |
          ssh "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" << 'ENDSSH'
            set -eu
            cd "${{ secrets.DEPLOY_PATH }}/code"
            mkdir -p images
            docker compose -f docker-compose.prod.yml build --no-cache
            docker compose -f docker-compose.prod.yml up -d --remove-orphans mariadb api web scheduler
            docker compose -f docker-compose.prod.yml ps
          ENDSSH

      - name: Verify services
        run: |
          ssh "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" << 'ENDSSH'
            set -eu
            cd "${{ secrets.DEPLOY_PATH }}/code"
            for service in mariadb api web scheduler; do
              test -n "$(docker compose -f docker-compose.prod.yml ps -q "$service")"
            done
          ENDSSH
